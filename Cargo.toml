[package]
name = "landslide"
version = "0.1.0"
edition = "2021"
authors = ["Archis Gore <me@archisgore.com>"]
description = "An Avalanche Custom VM Implemented in Rust"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/archisgore/landslide"
keywords = ["blockchain", "avalanche", "avax"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"]}
serde_json = "1.0"
hmac-sha256 = "1.1"
hex = "0.4"
log = "0.4"
log4rs = { version = "1.4" }
time = { version = "0.3.55", features = ["formatting", "parsing"]}
tower = "0.5.3"
http = "1.5.0"
jsonrpc-derive = "18.0.0"
jsonrpc-core = "18.0.0"
byteorder = "1.5.0"
bytes = "1.12.1"
num-derive = "0.5"
num-traits = "0.2"
thiserror = "2.0"
anyhow = "1.0"
bs58 = "0.5.1"
grr-plugin = "0.3.1"

[dev-dependencies]
assert-json-diff = "2.0.2"

[build-dependencies]
tonic-prost-build = "0.14"
